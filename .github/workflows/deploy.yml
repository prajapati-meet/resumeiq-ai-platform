name: Deploy to Oracle Cloud

# This workflow triggers automatically whenever you push code to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~/resumeiq-ai-platform
            
            # Discard any accidental local changes on the server
            git reset --hard HEAD
            
            # Pull the latest code from GitHub
            git pull origin main
            
            # Bypass the docker-compose v1.29.2 ContainerConfig bug
            docker-compose stop
            docker-compose rm -f
            
            # Rebuild and restart the Docker containers in the background
            docker-compose up -d --build
