version: '3.8'

services:
  # ---------------- Infrastructure ----------------

  mysql:
    image: mysql:8.0
    container_name: ara-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ara-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ara-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ara-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ara-kafka
    depends_on:
      - zookeeper
    ports:
      - "19092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - ara-network

  # ---------------- Backend Services ----------------

  auth-service:
    build: 
      context: ./resume-analyzer-platform
      dockerfile: auth-service/Dockerfile
    container_name: ara-auth-service
    depends_on:
      - mysql
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - ara-network

  resume-service:
    build: 
      context: ./resume-analyzer-platform
      dockerfile: resume-service/Dockerfile
    container_name: ara-resume-service
    depends_on:
      - mysql
      - kafka
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - ara-network

  ai-service:
    build: 
      context: ./resume-analyzer-platform
      dockerfile: ai-service/Dockerfile
    container_name: ara-ai-service
    depends_on:
      - mysql
      - kafka
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - ara-network

  api-gateway:
    build: 
      context: ./resume-analyzer-platform
      dockerfile: api-gateway/Dockerfile
    container_name: ara-api-gateway
    ports:
      - "18080:8080"
    depends_on:
      - auth-service
      - resume-service
      - ai-service
    environment:
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - RESUME_SERVICE_URL=${RESUME_SERVICE_URL}
      - AI_SERVICE_URL=${AI_SERVICE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
    networks:
      - ara-network

  # ---------------- Frontend ----------------

  frontend:
    build:
      context: ./resume-analyzer-frontend
      args:
        - VITE_API_URL=http://80.225.248.4:18080
    container_name: ara-frontend
    ports:
      - "15173:80"
    depends_on:
      - api-gateway
    networks:
      - ara-network

networks:
  ara-network:
    driver: bridge

volumes:
  mysql-data:
