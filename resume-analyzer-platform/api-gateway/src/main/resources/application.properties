server.port=8080
spring.application.name=api-gateway

spring.cloud.compatibility-verifier.enabled=false

# ── Route: Auth Service ─────────────────────────
spring.cloud.gateway.mvc.routes[0].id=auth-service
spring.cloud.gateway.mvc.routes[0].uri=${AUTH_SERVICE_URL}
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**
# ── Route: Resume Service ───────────────────────
spring.cloud.gateway.mvc.routes[1].id=resume-service
spring.cloud.gateway.mvc.routes[1].uri=${RESUME_SERVICE_URL}
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/resume/**

# ── Route: AI Service ───────────────────────────
spring.cloud.gateway.mvc.routes[2].id=ai-service
spring.cloud.gateway.mvc.routes[2].uri=${AI_SERVICE_URL}
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/ai/**

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

logging.level.org.springframework.cloud.gateway=DEBUG

frontend.url=${FRONTEND_URL}